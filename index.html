<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tech Resume Engine v3.0 | Premium Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Phosphor Icons (Ícones mais modernos que o SVG padrão) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['"Space Grotesk"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        dark: {
                            900: '#0f172a', // Slate 900
                            800: '#1e293b',
                            700: '#334155',
                        },
                        brand: {
                            500: '#6366f1', // Indigo
                            400: '#818cf8',
                            glow: 'rgba(99, 102, 241, 0.5)'
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Setup */
        :root {
            --theme-color: #4f46e5; /* Indigo 600 */
            --sidebar-bg: #1e1b4b; /* Deep Indigo */
            --text-primary: #0f172a;
            --text-secondary: #475569;
        }

        body {
            background-color: #020617;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08) 0%, transparent 25%);
            color: #f8fafc;
            overflow: hidden;
        }

        /* Scrollbar Customizada */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Classes Utilitárias Avançadas */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-group {
            position: relative;
            transition: all 0.3s ease;
        }
        
        .input-field {
            background: #0f172a;
            border: 1px solid #1e293b;
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .input-field:focus {
            border-color: var(--theme-color);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
            outline: none;
            background: #1e293b;
        }

        /* Preview Container */
        .preview-scroller {
            background-color: #0f172a;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 24px 24px;
        }

        #resume-paper {
            width: 210mm;
            min-height: 297mm;
            background: white;
            color: #0f172a;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform-origin: top center;
            transition: transform 0.3s ease;
            overflow: hidden;
        }

        /* Toast Notification Styling */
        .toast-wrapper {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: white;
            min-width: 300px;
            transform: translateX(100%);
            animation: slideInRight 0.4s forwards;
        }
        .toast.success { border-left: 4px solid #10b981; }
        .toast.info { border-left: 4px solid #3b82f6; }
        .toast.loading { border-left: 4px solid #6366f1; }

        @keyframes slideInRight {
            to { transform: translateX(0); }
        }
        @keyframes slideOutRight {
            to { transform: translateX(120%); opacity: 0; }
        }

        /* Checkbox Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--theme-color); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Typography Specifics for Resume */
        .resume-font-sans { font-family: 'Plus Jakarta Sans', sans-serif; }
        .resume-font-display { font-family: 'Space Grotesk', sans-serif; }
        .resume-font-mono { font-family: 'JetBrains Mono', monospace; }

        .whitespace-pre-line { white-space: pre-line; }
    </style>
</head>

    <script>
        // --- State Management ---
        const state = {
            zoom: 0.9,
            themeColor: '#4f46e5',
            font: 'resume-font-sans',
            photoOffset: 0
        };

        // --- Selectors ---
        const paper = document.getElementById('resume-paper');
        const inputs = document.querySelectorAll('input[data-target], textarea[data-target]');
        
        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            initListeners();
            addItem('education'); // Add default education
            addItem('project');   // Add default project
            renderAll();
        });

        function initListeners() {
            // Text Sync
            inputs.forEach(input => {
                input.addEventListener('input', (e) => {
                    const target = document.getElementById(`preview-${e.target.dataset.target}`);
                    if (target) target.innerText = e.target.value;
                });
            });

            // Theming
            document.getElementById('theme-color').addEventListener('input', (e) => {
                state.themeColor = e.target.value;
                document.documentElement.style.setProperty('--theme-color', state.themeColor);
                document.getElementById('color-hex').innerText = state.themeColor.toUpperCase();
            });

            // Font Switching
            document.getElementById('font-selector').addEventListener('change', (e) => {
                paper.classList.remove('resume-font-sans', 'resume-font-display', 'resume-font-mono');
                paper.classList.add(e.target.value);
            });

            // Photo Upload
            document.getElementById('photo-upload').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        document.getElementById('resume-img').src = ev.target.result;
                        document.getElementById('editor-img-preview').src = ev.target.result;
                        showToast('Foto atualizada!', 'success');
                    }
                    reader.readAsDataURL(file);
                }
            });

            // Photo Offset
            document.getElementById('photo-offset').addEventListener('input', (e) => {
                const val = e.target.value;
                document.getElementById('resume-img').style.transform = `translateY(${val}px)`;
                document.getElementById('offset-val').innerText = `${val}px`;
            });
        }

        // --- Dynamic Lists Logic ---
        function addItem(type) {
            const listId = type === 'education' ? 'education-list' : 'project-list';
            const container = document.getElementById(listId);
            const id = Date.now();

            const itemDiv = document.createElement('div');
            itemDiv.className = 'glass-panel p-3 rounded-lg border border-white/5 relative group animate-slide-up';
            
            if (type === 'education') {
                itemDiv.innerHTML = `
                    <button onclick="removeItem(this)" class="absolute top-2 right-2 text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity">
                        <i class="ph ph-trash"></i>
                    </button>
                    <div class="space-y-2">
                        <input type="text" class="input-edu-course input-field w-full rounded-lg px-2.5 py-1.5 text-xs font-bold" placeholder="Ex: Bacharelado em Ciência da Computação">
                        <input type="text" class="input-edu-school input-field w-full rounded-lg px-2.5 py-1.5 text-xs" placeholder="Instituição">
                        <input type="text" class="input-edu-year input-field w-full rounded-lg px-2.5 py-1.5 text-xs font-mono text-slate-400" placeholder="Ano de Conclusão">
                    </div>
                `;
                itemDiv.addEventListener('input', updateEducationPreview);
            } else {
                itemDiv.innerHTML = `
                    <button onclick="removeItem(this)" class="absolute top-2 right-2 text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity">
                        <i class="ph ph-trash"></i>
                    </button>
                    <div class="space-y-2">
                        <input type="text" class="input-proj-title input-field w-full rounded-lg px-2.5 py-1.5 text-xs font-bold" placeholder="Nome do Projeto">
                        <textarea class="input-proj-desc input-field w-full rounded-lg px-2.5 py-1.5 text-xs resize-none" rows="2" placeholder="Descrição das tecnologias utilizadas..."></textarea>
                    </div>
                `;
                itemDiv.addEventListener('input', updateProjectPreview);
            }

            container.appendChild(itemDiv);
            // Trigger update immediately to render in preview if data exists (optional)
        }

        window.removeItem = function(btn) {
            const container = btn.closest('[id$="-list"]');
            btn.closest('.glass-panel').remove();
            
            if (container.id === 'education-list') updateEducationPreview();
            else updateProjectPreview();
        }

        // --- Rendering Helpers ---
        function renderLists() {
            // Skills
            const skillsInput = document.querySelector('[data-target="skills"]');
            const skillsContainer = document.getElementById('preview-skills');
            skillsContainer.innerHTML = '';
            
            skillsInput.value.split(',').forEach(skill => {
                const s = skill.trim();
                if(s) {
                    const tag = document.createElement('span');
                    tag.className = 'bg-white/10 text-xs px-2 py-1 rounded border border-white/10 font-medium tracking-wide';
                    tag.innerText = s;
                    skillsContainer.appendChild(tag);
                }
            });

            // Soft Skills
            const softInput = document.querySelector('[data-target="softskills"]');
            const softContainer = document.getElementById('preview-softskills');
            softContainer.innerHTML = '';
            
            softInput.value.split(',').forEach(skill => {
                const s = skill.trim();
                if(s) {
                    const div = document.createElement('div');
                    div.className = 'flex items-center gap-2';
                    div.innerHTML = `<span class="w-1 h-1 rounded-full bg-indigo-300"></span> <span>${s}</span>`;
                    softContainer.appendChild(div);
                }
            });
        }

        // Attach listener to skills/softskills inputs
        document.querySelector('[data-target="skills"]').addEventListener('input', renderLists);
        document.querySelector('[data-target="softskills"]').addEventListener('input', renderLists);

        // Dynamic List Preview Updaters
        function updateEducationPreview() {
            const items = document.querySelectorAll('#education-list .glass-panel');
            const target = document.getElementById('preview-education');
            target.innerHTML = '';

            items.forEach(item => {
                const course = item.querySelector('.input-edu-course').value;
                const school = item.querySelector('.input-edu-school').value;
                const year = item.querySelector('.input-edu-year').value;

                const div = document.createElement('div');
                div.className = 'relative pl-4 pb-4';
                div.innerHTML = `
                    <div class="absolute -left-[5px] top-1.5 w-2.5 h-2.5 rounded-full border-2 border-white bg-indigo-500" style="background-color: var(--theme-color);"></div>
                    <h4 class="font-bold text-sm text-slate-800">${course}</h4>
                    <p class="text-xs text-slate-500">${school}</p>
                    <span class="inline-block mt-1 text-[10px] font-mono bg-slate-100 px-1.5 py-0.5 rounded text-slate-600">${year}</span>
                `;
                target.appendChild(div);
            });
        }

        function updateProjectPreview() {
            const items = document.querySelectorAll('#project-list .glass-panel');
            const target = document.getElementById('preview-projects');
            target.innerHTML = '';

            items.forEach(item => {
                const title = item.querySelector('.input-proj-title').value;
                const desc = item.querySelector('.input-proj-desc').value;

                const div = document.createElement('div');
                div.className = 'bg-white p-4 rounded-xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow';
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-bold text-sm text-indigo-900">${title}</h4>
                        <i class="ph ph-code text-indigo-400"></i>
                    </div>
                    <p class="text-xs text-slate-600 leading-relaxed whitespace-pre-line">${desc}</p>
                `;
                target.appendChild(div);
            });
        }

        function renderAll() {
            renderLists();
            updateEducationPreview();
            updateProjectPreview();
        }

        // --- Zoom Logic ---
        function setZoom() {
            paper.style.transform = `scale(${state.zoom})`;
            document.getElementById('preview-scale-text').innerText = `${Math.round(state.zoom * 100)}%`;
        }
        window.zoomIn = () => { state.zoom += 0.1; setZoom(); }
        window.zoomOut = () => { if(state.zoom > 0.4) state.zoom -= 0.1; setZoom(); }

        // --- PDF Export Logic ---
        window.handleExport = function() {
            const btn = document.getElementById('btn-export');
            const originalContent = btn.innerHTML;
            
            // Loading State
            btn.innerHTML = `<i class="ph ph-spinner animate-spin text-lg"></i> <span>Gerando...</span>`;
            btn.disabled = true;
            showToast('Renderizando documento de alta resolução...', 'info');

            const element = document.getElementById('resume-paper');
            
            const opt = {
                margin: 0,
                filename: 'curriculum_tech_v3.pdf',
                image: { type: 'jpeg', quality: 1.0 },
                html2canvas: { scale: 4, useCORS: true, letterRendering: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                showToast('Download concluído com sucesso!', 'success');
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }).catch(err => {
                console.error(err);
                showToast('Erro ao gerar PDF.', 'error');
                btn.innerHTML = originalContent;
                btn.disabled = false;
            });
        }

        // --- Toast System ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            let icon = 'info';
            if (type === 'success') icon = 'check-circle';
            if (type === 'error') icon = 'warning-circle';

            toast.innerHTML = `<i class="ph ph-${icon} text-lg"></i> <span class="text-sm font-medium">${message}</span>`;
            
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideOutRight 0.4s forwards';
                toast.addEventListener('animationend', () => toast.remove());
            }, 3000);
        }
    </script>
</body>
</html>
